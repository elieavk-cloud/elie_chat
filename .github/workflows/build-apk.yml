name: Build trial Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract application source
        run: unzip -q Wasla-Android-Source-v0.1.zip -d source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/wasla/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
        working-directory: source/wasla
      - run: npm run typecheck && npm run test:security
        working-directory: source/wasla
      - run: npx expo prebuild --platform android --no-install
        working-directory: source/wasla
      - name: Build standalone trial APK
        working-directory: source/wasla/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: Wasla-trial-arm64
          path: source/wasla/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
